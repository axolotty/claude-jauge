version: 52

# CI OneDev. Elle ne s'occupe que de ce qu'une machine Linux sait faire :
# eprouver le coeur, et produire le binaire CLI.
#
# Les paquets du widget (.dmg, .msi, AppImage) sont bati par GitHub Actions, dans
# .github/workflows/release.yml : un .dmg ne se compile pas ailleurs que sur
# macOS, et l'app Tauri se lie a webkit2gtk. Le partage des taches est donc :
# ici les tests et le CLI, la-bas les paquets des trois OS.

jobs:
- name: tests
  steps:
  - !CheckoutStep
    name: recuperer les sources
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
  - !CommandStep
    name: cargo test
    runInContainer: true
    image: rust:1-slim-trixie
    # Obligatoire, et attendu sous la forme <uid>:<gid>. root convient : le
    # conteneur est jetable.
    runAs: 0:0
    interpreter: !PosixInterpreter
      # Obligatoire : OneDev refuse un interpreteur sans shell declare.
      shell: bash
      commands: |
        set -e
        # --locked : un Cargo.lock qui a bouge doit faire echouer la CI, pas
        # etre repare en silence dans son dos.
        cargo test --workspace --locked
    useTTY: true
    condition: SUCCESSFUL
  triggers:
  - !BranchUpdateTrigger
    # Obligatoire. `anyone` : peu importe qui pousse, les tests tournent.
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600

- name: cli linux
  steps:
  - !CheckoutStep
    name: recuperer les sources
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
  - !CommandStep
    name: tester puis compiler
    runInContainer: true
    image: rust:1-slim-trixie
    # Obligatoire, et attendu sous la forme <uid>:<gid>. root convient : le
    # conteneur est jetable.
    runAs: 0:0
    interpreter: !PosixInterpreter
      # Obligatoire : OneDev refuse un interpreteur sans shell declare.
      shell: bash
      commands: |
        set -e
        # On reteste avant de publier : un artefact de release ne sort pas d'un
        # arbre dont on n'a pas verifie qu'il passe.
        cargo test --workspace --locked
        cargo build --release --locked -p claude-jauge-cli
        mkdir -p artefacts
        cp target/release/claude-jauge artefacts/claude-jauge-linux-x86_64
        ./artefacts/claude-jauge-linux-x86_64 --version
    useTTY: true
    condition: SUCCESSFUL
  - !PublishArtifactStep
    name: publier le binaire
    sourcePath: artefacts
    artifacts: '**'
    condition: SUCCESSFUL
  triggers:
  - !TagCreateTrigger
    # Sans ce filtre, n'importe quel tag declencherait une release.
    tags: v*
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
