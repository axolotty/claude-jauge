# Paquets des trois OS, sur tag de version.
#
# Ce fichier existe parce qu'un .dmg ne se compile que sur macOS et un .msi que
# sur Windows : la CI OneDev, elle, ne dispose que de Linux. Le partage est donc
# net, et decrit dans .onedev-buildspec.yml : la-bas les tests et le binaire CLI
# a chaque push, ici les paquets a chaque tag.
#
#   git tag v0.2.0 && git push github v0.2.0
#
# La release est creee en brouillon : rien n'est publie avant relecture.

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  # Le brouillon est cree UNE fois, avant la matrice.
  #
  # Sans ce job, chaque instance de tauri-action cree la release si elle ne la
  # voit pas encore : quatre jobs lances ensemble se marchent dessus et on
  # obtient deux releases pour le meme tag, avec les paquets eparpilles entre
  # les deux. C'est arrive en v0.1.0. `releaseId` ci-dessous rattache tout le
  # monde au meme brouillon.
  brouillon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.creer.outputs.id }}
    steps:
      - name: creer le brouillon
        id: creer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent : relancer le workflow ne doit pas fabriquer un doublon.
          # On liste au lieu d'interroger /releases/tags/{tag}, qui ignore les
          # brouillons. --retry : une API qui hoquete ne doit pas couter une
          # release entiere.
          id=$(gh api --retry 5 "repos/${GITHUB_REPOSITORY}/releases" \
                 --jq "[.[] | select(.tag_name == \"${TAG}\" and .draft)] | first | .id")
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            id=$(gh api --retry 5 --method POST "repos/${GITHUB_REPOSITORY}/releases" \
                   -f tag_name="${TAG}" \
                   -f name="claude-jauge ${TAG}" \
                   -f body="Paquets construits automatiquement. Voir le README pour l'installation." \
                   -F draft=true -F prerelease=false \
                   --jq '.id')
            echo "brouillon cree : $id"
          else
            echo "brouillon deja present : $id"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  paquets:
    needs: brouillon
    permissions:
      contents: write

    strategy:
      # Un OS qui echoue ne doit pas priver des paquets des deux autres.
      fail-fast: false
      matrix:
        include:
          # Les Mac Apple Silicon et Intel prennent deux binaires distincts.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            cible: aarch64-apple-darwin
            nom_cli: claude-jauge-macos-arm64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            cible: x86_64-apple-darwin
            nom_cli: claude-jauge-macos-x86_64
          # 22.04 plutot que la derniere : on se lie a la glibc du runner, donc
          # partir d'une vieille elargit le parc compatible.
          - platform: ubuntu-22.04
            args: ""
            cible: ""
            nom_cli: claude-jauge-linux-x86_64
          - platform: windows-latest
            args: ""
            cible: ""
            nom_cli: claude-jauge-windows-x86_64.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cible }}

      # Le cache Rust : sans lui, chaque tag recompile tout Tauri.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/tray/src-tauri

      - name: dependances systeme (Linux seulement)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            build-essential \
            pkg-config

      - name: dependances du front
        working-directory: apps/tray
        run: npm ci

      - name: paquet du widget
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/tray
          # L'id, et non le tag : c'est ce qui interdit a l'action d'en creer une.
          releaseId: ${{ needs.brouillon.outputs.id }}
          args: ${{ matrix.args }}

      # Le CLI voyage a part : c'est lui qui porte `claude-jauge statusline`,
      # donc il sert meme a qui ne veut pas du widget.
      - name: binaire CLI
        shell: bash
        run: |
          set -e
          if [ -n "${{ matrix.cible }}" ]; then
            cargo build --release --locked -p claude-jauge-cli --target ${{ matrix.cible }}
            chemin="target/${{ matrix.cible }}/release/claude-jauge"
          else
            cargo build --release --locked -p claude-jauge-cli
            chemin="target/release/claude-jauge"
          fi
          [ -f "$chemin.exe" ] && chemin="$chemin.exe"
          cp "$chemin" "${{ matrix.nom_cli }}"

      - name: joindre le CLI au brouillon
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.brouillon.outputs.id }}
          NOM: ${{ matrix.nom_cli }}
        run: |
          set -euo pipefail
          # On vise l'id, jamais le tag.
          #
          # `gh release upload <tag>` commence par resoudre le tag via
          # /releases/tags/{tag}. Cet endpoint a deux defauts : il ignore les
          # brouillons, et c'est lui qui a renvoye 503 pendant l'incident du
          # 16 juillet, faisant tomber les quatre jobs alors que les paquets
          # etaient deja deposes. Or l'id nous est donne par le job `brouillon` :
          # cette recherche etait inutile autant que fragile.
          #
          # --retry couvre le reste : une release a moitie publiee parce que
          # l'API a hoquete trois secondes n'a aucun interet.
          curl --silent --show-error --fail-with-body \
               --retry 5 --retry-delay 5 --retry-all-errors \
               --request POST \
               --header "Authorization: Bearer ${GH_TOKEN}" \
               --header "X-GitHub-Api-Version: 2022-11-28" \
               --header "Content-Type: application/octet-stream" \
               --data-binary "@${NOM}" \
               "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${ID}/assets?name=${NOM}" \
               --output /dev/null
          echo "${NOM} joint au brouillon ${ID}"
